/* ================= Drawer / modal ================= */
function openDrawer(html){ const d=$('#drawer'); d.innerHTML='<button class="close" data-act="closeDrawer" aria-label="Close">✕</button>'+html; d.classList.add('open'); d.setAttribute('aria-hidden','false'); $('#scrim').classList.add('open'); setTimeout(()=>d.querySelector('.close').focus(),50); }
function closeDrawer(){ const d=$('#drawer'); d.classList.remove('open'); d.setAttribute('aria-hidden','true'); $('#scrim').classList.remove('open'); ui.drawer=null; }
function modal(html){ const m=$('#modal'); m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true">${html}</div>`; m.classList.add('open'); setTimeout(()=>{ const f=m.querySelector('input,textarea,select,.btn.primary,.btn.danger'); f&&f.focus(); },30); }
function closeModal(){ $('#modal').classList.remove('open'); $('#modal').innerHTML=''; MODAL_OK=null; }
function info(t,msg){ modal(`<h3>${esc(t)}</h3><p>${esc(msg)}</p><div class="mact"><button class="btn primary" data-act="mclose">OK</button></div>`); }
function ask(t,msg,okLabel,danger,fn,fieldsHtml=''){ MODAL_OK=fn; modal(`<h3>${esc(t)}</h3>${msg?`<p>${esc(msg)}</p>`:''}${fieldsHtml}<div class="mact"><button class="btn" data-act="mclose">Cancel</button><button class="btn ${danger?'danger':'primary'}" data-act="mok">${esc(okLabel)}</button></div>`); }
function formVals(root){ const o={}; root.querySelectorAll('[name]').forEach(el=>o[el.name]=el.value); return o; }
function copyText(text){
  const done=()=>toast('Copied');
  try{ if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(text).then(done,()=>fallback()); return; } }catch(e){}
  fallback();
  function fallback(){ const ta=$('#modal textarea.copy'); if(ta){ ta.focus(); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast('Select the text and copy it'); } } }
}
function showText(title,text,file){
  if(!EMBED&&file){ try{ const b=new Blob([text],{type:file.endsWith('.csv')?'text/csv':'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=file; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); toast('Saved '+file); return; }catch(e){} }
  modal(`<h3>${esc(title)}</h3><p>Copy this and paste it into a spreadsheet or a text file.</p><textarea class="copy" readonly>${esc(text)}</textarea><div class="mact"><button class="btn" data-act="mclose">Close</button><button class="btn primary" data-act="copyModal">Copy</button></div>`);
}
const csv=rows=>rows.map(r=>r.map(v=>{ v=String(v??''); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(',')).join('\n');

/* ================= Actions ================= */
const ACT={
  go(v){ closeDrawer(); if(v==='new'){ ui.wiz={d:newDraft(),step:0,editingId:null,label:'New RAMS'}; ui.view='wizard'; } else ui.view=v; ui.f={q:'',type:'',status:''}; render(); },
  closeDrawer, mclose:closeModal,
  theme(){ setTheme(curTheme()==='dark'?'light':'dark'); renderShell(); },
  mok(){ const f=MODAL_OK; const vals=formVals($('#modal')); closeModal(); f&&f(vals); },
  copyModal(){ copyText($('#modal textarea.copy').value); },
  wsSet(id){ ui.ws=id; closeDrawer(); ui.view='dash'; render(); },
  openRams(id){ READYONLY?drawerJob(id):drawerRams(id); },
  editJob(id){ drawerJobEdit(id); },
  saveJob(id){
    const v=formVals($('#jform')); const pick=n=>[...document.querySelectorAll('#jform input[name="'+n+'"]:checked')].map(x=>x.value);
    if(!v.site.trim()) return toast('Enter the site / job name');
    if(v.status==='Approved'&&!v.approver.trim()) return toast('Enter who approved the RAMS');
    const data={site:v.site.trim(),address:v.address,start:v.start||TODAY,days:Math.max(1,parseInt(v.days)||1),ramsRef:v.ramsRef.trim(),status:v.status,approver:v.approver.trim(),hospital:v.hospital,tasks:pick('tasks'),crew:pick('crew'),kit:pick('kit')};
    const now=new Date().toISOString(); let r;
    if(id){ r=ramsById(id); data.approvedOn=data.status==='Approved'?(r.status==='Approved'&&r.ramsRef===data.ramsRef?r.approvedOn:TODAY):''; if(data.ramsRef!==r.ramsRef){ r.signoff={}; } Object.assign(r,data,{updated:now}); log(r.ref+' updated'); }
    else { r={id:uid('r'),ref:nextRef('JOB'),rev:1,client:S.clients[0]?.id,conds:[],risks:[],pc:'',contact:'',contactPhone:'',scope:'',preparedBy:'',ppeExtra:'',firstAider:'',assembly:'',method:'',methodEdited:true,note:'',signoff:{},created:now,updated:now,...data,approvedOn:data.status==='Approved'?TODAY:''}; S.rams.push(r); log(r.ref+' added: '+r.site); }
    save(); closeDrawer(); render(true); toast(r.ref+' saved');
  },
  delJob(id){ const r=ramsById(id); ask('Delete '+r.ref+'?','This can’t be undone.','Delete',true,()=>{ S.rams=S.rams.filter(x=>x.id!==id); S.assets.forEach(a=>{ if(a.job===r.ref){ a.status='S'; a.job=null; } }); log(r.ref+' deleted'); save(); closeDrawer(); render(true); toast('Deleted'); }); },
  openDoc(id){ closeDrawer(); ui.docId=id; ui.view='doc'; render(); },
  goReady(id){ closeDrawer(); const r=ramsById(id); if(r) ui.readySel=r.id; ui.view='ready'; render(); },
  editRams(id){ closeDrawer(); const r=ramsById(id); if(!r) return; startWizard(JSON.parse(JSON.stringify(r)), r.id, 'Edit '+r.ref+' Rev '+r.rev); },
  newRev(id){ closeDrawer(); const r=ramsById(id); if(!r) return; const d=JSON.parse(JSON.stringify(r)); delete d.id; Object.assign(d,{rev:r.rev+1,status:'Draft',approver:'',approvedOn:'',note:'',signoff:{}}); startWizard(d,null,'New revision: '+r.ref+' Rev '+(r.rev+1)); toast('Rev '+r.rev+' stays current until Rev '+(r.rev+1)+' is approved'); },
  dupRams(id){ closeDrawer(); const r=ramsById(id); if(!r) return; const d=JSON.parse(JSON.stringify(r)); delete d.id; Object.assign(d,{ref:'',rev:1,status:'Draft',approver:'',approvedOn:'',note:'First issue',signoff:{},site:r.site+' (copy)',start:addDays(TODAY,7)}); startWizard(d,null,'New RAMS from '+r.ref); },
  closeRams(id){ const r=ramsById(id); ask('Close '+r.ref+'?','Marks the job as finished. The RAMS stays in the register and can be reopened as a new revision.','Close job',false,()=>{ r.status='Closed'; r.updated=new Date().toISOString(); S.assets.forEach(a=>{ if(a.job===r.ref){ a.status='S'; a.job=null; a.hist.push({t:new Date().toISOString(),msg:'Returned from '+r.ref}); } }); log(r.ref+' closed'); save(); closeDrawer(); render(true); toast(r.ref+' closed'); }); },
  delRams(id){ const r=ramsById(id); ask('Delete '+r.ref+' Rev '+r.rev+'?','This can’t be undone.','Delete',true,()=>{ S.rams=S.rams.filter(x=>x.id!==id); log(r.ref+' Rev '+r.rev+' deleted'); save(); closeDrawer(); ui.view='rams'; render(); toast('Deleted'); }); },
  step(i){ i=+i; const w=ui.wiz; if(i<0||i>3) return; if(i>w.step){ const bad=stepOk(i); if(bad) return toast(bad); } if(i===2) syncRisks(w.d); w.step=i; render(); },
  saveWiz(arg){ saveWizard(arg==='stay'); },
  crewAll(){ ui.crewAll=!ui.crewAll; render(true); },
  addHz(){ const h=$('#nh-h').value.trim(); if(!h) return toast('Enter the hazard'); ui.wiz.d.risks.push({h,who:$('#nh-w').value.trim()||'Operatives',iL:3,iS:3,c:$('#nh-c').value.trim()||'Controls to be agreed.',rL:2,rS:3,src:'custom'}); render(true); },
  rmHz(i){ ui.wiz.d.risks.splice(+i,1); render(true); },
  regenMethod(){ const d=ui.wiz.d; d.methodEdited=false; d.method=genMethod(d); render(true); toast('Method statement rebuilt'); },
  print(){
    if(!EMBED){ try{ window.print(); return; }catch(e){} }
    info('Print or save as PDF','Printing is switched off in this preview. In your installed copy this button opens the print dialog, already laid out for A4 with the client letterhead. Choose “Save as PDF” to email it.');
  },
  copyDoc(id){ const r=ramsById(id), c=client(r.client); const t=[`${c.name} · RISK ASSESSMENT & METHOD STATEMENT`,`${r.ref} Rev ${r.rev} · ${r.status}`,'',`Site: ${r.site}`,`Address: ${r.address}`,`Dates: ${fmt(r.start)} to ${fmt(jobEnd(r))}`,`Approved by: ${r.approver||'—'} ${r.approvedOn?fmt(r.approvedOn):''}`,'','SCOPE',r.scope,'','RISK ASSESSMENT',...r.risks.map((x,i)=>`${i+1}. ${x.h} (${x.who}) · initial ${x.iL*x.iS} · residual ${x.rL*x.rS} ${BANDN[band(x.rL,x.rS)]}\n   Controls: ${x.c}`),'','METHOD STATEMENT',r.method,'','PPE: '+ppeFor(r).join(', '),'',`EMERGENCY: 999 · A&E: ${r.hospital} · Assembly: ${r.assembly}`].join('\n'); showText('Copy RAMS as text',t); },
  copyReady(id){ const r=ramsById(id), a=assess(r); const t=[`READINESS: ${VERD[a.verdict].t}`,`${r.ref}${READYONLY?' · RAMS '+(r.ramsRef||'awaited'):' Rev '+r.rev} · ${r.site} · ${client(r.client)?.name}`,`${fmt(a.start)} to ${fmt(a.end)} · checked ${fmt(TODAY)}`,'',...a.checks.filter(x=>x.lvl!=='pass').map(x=>`[${x.lvl.toUpperCase()}] ${x.t.replace(/<[^>]+>/g,'')}: ${x.p.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&#39;/g,"'")}`),'',`${a.checks.filter(x=>x.lvl==='pass').length} checks passed.`].join('\n'); showText('Readiness summary',t); },
  bookKit(id){ const r=ramsById(id); const items=r.kit.map(asset).filter(a=>a&&a.status==='S'); ask('Book out '+items.length+' item(s) to '+r.ref+'?','They’ll show as On job until returned or the job is closed.','Book out',false,()=>{ items.forEach(a=>{ a.status='D'; a.job=r.ref; a.hist.push({t:new Date().toISOString(),msg:'Booked out to '+r.ref}); }); log(items.length+' item(s) booked out to '+r.ref); save(); render(true); toast('Kit booked out'); }); },
  returnKit(id){ const r=ramsById(id); let n=0; S.assets.forEach(a=>{ if(a.job===r.ref){ a.status='S'; a.job=null; n++; a.hist.push({t:new Date().toISOString(),msg:'Returned from '+r.ref}); } }); log(n+' item(s) returned from '+r.ref); save(); render(true); toast(n+' item(s) returned'); },
  sign(pid){ const r=ramsById(ui.readySel); r.signoff=r.signoff||{}; r.signoff[pid]=new Date().toISOString(); log('Briefing for '+r.ref+' signed by '+person(pid)?.name); save(); render(true); },
  unsign(pid){ const r=ramsById(ui.readySel); delete r.signoff[pid]; save(); render(true); },
  editClient(id){ drawerClient(id); },
  saveClient(id){ const v=formVals($('#cform')); if(!v.name.trim()) return toast('Enter the company name'); const ppe=v.ppe.split(',').map(s=>s.trim()).filter(Boolean); const initials=(v.initials||v.name.split(/\s+/).map(w=>w[0]).join('').slice(0,2)).toUpperCase();
    if(id){ Object.assign(client(id),{...v,ppe,initials}); log('Client updated: '+v.name); } else { const c={id:uid('c'),...v,ppe,initials}; S.clients.push(c); log('Client added: '+v.name); }
    save(); closeDrawer(); render(true); toast('Client saved'); },
  delClient(id){ const c=client(id); ask('Delete '+c.name+'?','','Delete',true,()=>{ S.clients=S.clients.filter(x=>x.id!==id); if(ui.ws===id) ui.ws='all'; log('Client deleted: '+c.name); save(); closeDrawer(); render(); }); },
  openAsset(id){ drawerAsset(id); },
  addAsset(){ const cid=ui.ws!=='all'?ui.ws:S.clients[0]?.id; ask('Add kit item','','Add item',false,v=>{ if(!v.name.trim()) return toast('Enter the item name'); const T=ASSET_TYPES[v.type]; const last=v.last||TODAY; const a={id:uid('a'),client:v.client,type:v.type,name:v.name.trim(),serial:v.serial.trim()||('NEW-'+(S.assets.length+1)),last,next:addDays(last,T.every),status:'S',job:null,note:'',hist:[{t:new Date().toISOString(),msg:'Added; '+T.insp+' '+fmt(last)}]}; S.assets.push(a); log('Kit added: '+a.serial+' '+a.name); save(); render(true); toast('Item added'); },
    `<div class="fields" style="grid-template-columns:1fr">${fld('Type',`<select name="type">${Object.entries(ASSET_TYPES).map(([k,t])=>opt(k,t.l)).join('')}</select>`)}${fld('Item name',`<input name="name" placeholder="e.g. Scissor lift 10 m">`,'',true)}${fld('ID / serial',`<input name="serial" placeholder="e.g. BR-MEWP-02">`)}${fld('Client',`<select name="client">${S.clients.map(c=>opt(c.id,c.name,c.id===cid)).join('')}</select>`)}${fld('Last inspection date',`<input type="date" name="last" value="${TODAY}">`)}</div>`); },
  inspect(id){ const a=asset(id), T=ASSET_TYPES[a.type]; ask('Record '+T.insp.toLowerCase(),a.serial+' '+a.name,'Save',false,v=>{ const when=v.date||TODAY; if(v.result==='pass'){ a.last=when; a.next=addDays(when,T.every); if(a.status==='U'||a.status==='R'){ a.status='S'; a.note=''; } a.hist.push({t:new Date().toISOString(),msg:T.insp+' passed '+fmt(when)+(v.notes?': '+v.notes:'')+'. Next due '+fmt(a.next)}); toast('Next due '+fmt(a.next)); } else { a.status='U'; a.note=v.notes||'Failed '+T.insp.toLowerCase(); a.hist.push({t:new Date().toISOString(),msg:T.insp+' failed: '+a.note}); toast('Item quarantined'); } log(a.serial+' '+T.insp+' '+(v.result==='pass'?'passed':'failed')); save(); drawerAsset(id); render(true); },
    `<div class="fields" style="grid-template-columns:1fr">${fld('Date',`<input type="date" name="date" value="${TODAY}">`)}${fld('Result',`<select name="result"><option value="pass">Pass</option><option value="fail">Fail (quarantine)</option></select>`)}${fld('Notes / certificate number',`<input name="notes">`)}</div>`); },
  quarantine(id){ const a=asset(id); ask('Quarantine '+a.serial+'?','It will block every job it’s allocated to until it’s returned to service.','Quarantine',true,v=>{ a.status='U'; a.note=v.reason||'Defect reported'; a.hist.push({t:new Date().toISOString(),msg:'Quarantined: '+a.note}); log(a.serial+' quarantined: '+a.note); save(); drawerAsset(id); render(true); },`${fld('Reason',`<input name="reason" placeholder="e.g. Damaged lanyard webbing">`)}`); },
  toRepair(id){ const a=asset(id); a.status='R'; a.hist.push({t:new Date().toISOString(),msg:'Sent for repair'}); log(a.serial+' sent for repair'); save(); drawerAsset(id); render(true); },
  toService(id){ const a=asset(id); if(a.next<TODAY) return info('Inspection overdue','Record a passed '+ASSET_TYPES[a.type].insp.toLowerCase()+' first. That returns the item to service.'); a.status='S'; a.note=''; a.hist.push({t:new Date().toISOString(),msg:'Returned to service'}); log(a.serial+' returned to service'); save(); drawerAsset(id); render(true); },
  delAsset(id){ const a=asset(id); ask('Delete '+a.serial+'?','It will also be removed from any RAMS it’s allocated to.','Delete',true,()=>{ S.assets=S.assets.filter(x=>x.id!==id); S.rams.forEach(r=>r.kit=r.kit.filter(k=>k!==id)); log('Kit deleted: '+a.serial); save(); closeDrawer(); render(true); }); },
  openPerson(id){ drawerPerson(id); },
  savePerson(id){ const v=formVals($('#pform')); if(!v.name.trim()) return toast('Enter a name'); const certs={}; Object.keys(CERTS).forEach(k=>{ if(v['cert_'+k]) certs[k]=v['cert_'+k]; });
    if(id){ Object.assign(person(id),{name:v.name.trim(),role:v.role,client:v.client,certs}); log('Crew updated: '+v.name); } else { S.crew.push({id:uid('p'),name:v.name.trim(),role:v.role,client:v.client,certs}); log('Crew added: '+v.name); }
    save(); closeDrawer(); render(true); toast('Saved'); },
  delPerson(id){ const p=person(id); ask('Delete '+p.name+'?','They will be removed from any RAMS crew list.','Delete',true,()=>{ S.crew=S.crew.filter(x=>x.id!==id); S.rams.forEach(r=>r.crew=r.crew.filter(k=>k!==id)); log('Crew deleted: '+p.name); save(); closeDrawer(); render(true); }); },
  exportRams(){ if(READYONLY) return showText('Jobs (CSV)',csv([['Job','Site','Address','Start','Days','RAMS ref','RAMS status','Crew','Kit','Readiness'],...latest().map(r=>[r.ref,r.site,r.address,r.start,r.days,r.ramsRef,stLabel(r.status),r.crew.map(person).filter(Boolean).map(p=>p.name).join('; '),r.kit.map(asset).filter(Boolean).map(a=>a.serial).join('; '),r.status==='Closed'?'':VERD[assess(r).verdict].t])]),'jobs.csv'); showText('RAMS register (CSV)',csv([['Ref','Rev','Client','Site','Address','Start','Days','Status','Highest residual','Readiness','Approved by','Approved on'],...latest().filter(r=>inWs(r.client)).map(r=>[r.ref,r.rev,client(r.client)?.name,r.site,r.address,r.start,r.days,r.status,BANDN[highestResidual(r)]||'',r.status==='Closed'?'':VERD[assess(r).verdict].t,r.approver,r.approvedOn])]),'rams-register.csv'); },
  exportKit(){ showText('Kit & vehicles (CSV)',csv([['ID','Item','Type','Client','Status','Inspection','Last','Next due','Note'],...S.assets.filter(a=>inWs(a.client)).map(a=>[a.serial,a.name,ASSET_TYPES[a.type].l,client(a.client)?.name,ASTATUS[a.status].l,ASSET_TYPES[a.type].insp,a.last,a.next,a.note])]),'kit-register.csv'); },
  exportCrew(){ showText('Crew & competence (CSV)',csv([['Name','Role','Client',...Object.values(CERTS).map(c=>c.l)],...S.crew.filter(p=>inWs(p.client)).map(p=>[p.name,p.role,client(p.client)?.name,...Object.keys(CERTS).map(k=>p.certs[k]||'')])]),'crew-competence.csv'); },
  saveSettings(){ const v=formVals($('#sform')); S.settings.licensee=v.licensee.trim()||CFG.licensee; S.settings.preparer=v.preparer.trim(); log('Settings updated'); save(); render(true); toast('Saved'); },
  backup(){ showText('Backup',JSON.stringify(S),'rams-readiness-backup.json'); },
  restore(){ ask('Restore from backup','Paste the backup text. This replaces everything in this browser.','Restore',true,v=>{ try{ const o=JSON.parse(v.data); if(!o||o.v!==1||!Array.isArray(o.rams)) throw 0; S=o; save(); ui.view='dash'; render(); toast('Restored'); }catch(e){ info('That backup didn’t load','Check you pasted the whole backup text.'); } },`<textarea name="data" class="copy" placeholder="Paste backup here"></textarea>`); },
  reset(){ ask('Reset to sample data?','Everything you’ve entered in this browser will be replaced with the sample clients.','Reset',true,()=>{ S=seed(); save(); ui.ws='all'; ui.view='dash'; render(); toast('Sample data loaded'); }); }
};

/* ================= Events ================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  if(b.tagName==='INPUT'&&b.type==='checkbox'){ ACT[b.dataset.act]?.(b.dataset.arg,b,e); return; }
  if(b.disabled) return;
  e.preventDefault(); ACT[b.dataset.act]?.(b.dataset.arg??'',b,e);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.bind&&ui.wiz){ const k=t.dataset.bind; ui.wiz.d[k]= k==='days'?Math.max(1,parseInt(t.value)||1):t.value; if(k==='method') ui.wiz.d.methodEdited=true; return; }
  if(t.dataset.risk&&ui.wiz&&t.tagName==='TEXTAREA'){ const [i,k]=t.dataset.risk.split(':'); ui.wiz.d.risks[+i][k]=t.value; return; }
  if(t.dataset.on==='q'){ ui.f.q=t.value; refreshTable(); }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.bind&&ui.wiz){ const d=ui.wiz.d, k=t.dataset.bind;
    if(k==='client'){ d.client=t.value; const c=client(t.value); if(c){ if(!d.hospital) d.hospital=c.hospital; if(!d.assembly) d.assembly=c.assembly; if(!d.contact) d.contact=c.contact; if(!d.contactPhone) d.contactPhone=c.phone; } d.crew=d.crew.filter(id=>ui.crewAll||person(id)?.client===d.client); d.kit=d.kit.filter(id=>asset(id)?.client===d.client); render(true); }
    else if(k==='status'){ d.status=t.value; if(t.value==='Approved'&&d.risks.some(r=>band(r.rL,r.rS)==='H')) toast('High residual risk: approval will be blocked on save'); }
    return; }
  if(t.dataset.tog&&ui.wiz){ const d=ui.wiz.d, arr=d[t.dataset.tog]; const i=arr.indexOf(t.value); if(t.checked&&i<0) arr.push(t.value); if(!t.checked&&i>=0) arr.splice(i,1); if(t.dataset.tog==='conds'||t.dataset.tog==='tasks') syncRisks(d); render(true); return; }
  if(t.dataset.risk&&ui.wiz&&t.tagName==='SELECT'){ const [i,k]=t.dataset.risk.split(':'); ui.wiz.d.risks[+i][k]=+t.value; render(true); return; }
  if(t.dataset.on==='ws'){ ui.ws=t.value; closeDrawer(); if(ui.view==='wizard'||ui.view==='doc') ui.view='dash'; render(); return; }
  if(t.dataset.on==='readySel'){ ui.readySel=t.value; render(true); return; }
  if(t.dataset.on==='type'||t.dataset.on==='status'){ ui.f[t.dataset.on]=t.value; refreshTable(); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if($('#modal').classList.contains('open')) closeModal(); else closeDrawer(); } });
function refreshTable(){ const el=$('#tbl'); if(!el) return; el.innerHTML= ui.view==='rams'?(READYONLY?jobsTable():ramsTable()): ui.view==='kit'?kitTable(): ui.view==='crew'?crewTable():''; }

/* ================= Boot ================= */
S=load(); save(); render();
</script>
