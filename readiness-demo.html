<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deployment Readiness & Asset Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F2ED; --sheet:#FBFBF8; --ink:#1B2230; --ink2:#4A5263; --muted:#7A8190;
  --rule:#D6D9CF; --rule2:#E6E8E0;
  --blue:#1F4E8C; --blue-soft:#E3EAF4;
  --magenta:#A3246E; --magenta-soft:#F5E4EE;
  --green:#2D7A4E; --green-soft:#E1EFE6;
  --amber:#A86A12; --amber-soft:#F6ECD9;
  --red:#B3261E; --red-soft:#F6E1DF;
  --sans:'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --mono:'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
button{font-family:inherit;font-size:13px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,tr:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12.5px}

/* Frame */
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--ink);color:#DDE2EA;padding:22px 16px;display:flex;flex-direction:column;gap:22px}
.brand{font-weight:800;font-size:17px;letter-spacing:-.01em;color:#fff;line-height:1.2}
.brand small{display:block;font-weight:500;font-size:12px;color:#9AA3B2;margin-top:4px;letter-spacing:0}
nav{display:flex;flex-direction:column;gap:2px}
nav button{background:none;border:0;color:#C4CAD5;text-align:left;padding:9px 10px;border-radius:3px;font-size:14px;font-weight:500;display:flex;justify-content:space-between;align-items:center}
nav button:hover{background:#262F40;color:#fff}
nav button.active{background:#fff;color:var(--ink)}
nav .count{font-family:var(--mono);font-size:11px;background:var(--magenta);color:#fff;border-radius:9px;padding:1px 7px}
.side-foot{margin-top:auto;font-size:12px;color:#8C95A4;border-top:1px solid #2E3748;padding-top:14px}
.side-foot b{color:#DDE2EA;font-weight:600}

main{padding:26px 34px 60px;max-width:1320px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.top h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.top p{margin:4px 0 0;color:var(--ink2);max-width:70ch}
.top .date{font-family:var(--mono);font-size:12px;color:var(--ink2);text-align:right;white-space:nowrap}

h2{font-size:15px;font-weight:700;margin:0 0 12px;letter-spacing:-.005em}
.panel{background:var(--sheet);border:1px solid var(--rule);padding:18px 20px}
.grid{display:grid;gap:18px}
.g-2{grid-template-columns:1.35fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}

/* Status chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px 2px 7px;border-radius:2px;white-space:nowrap;border-left:3px solid}
.chip.s{background:var(--green-soft);color:var(--green);border-color:var(--green)}
.chip.d{background:var(--blue-soft);color:var(--blue);border-color:var(--blue)}
.chip.r{background:var(--amber-soft);color:var(--amber);border-color:var(--amber)}
.chip.u{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.chip.i{background:var(--magenta-soft);color:var(--magenta);border-color:var(--magenta)}
.chip.n{background:var(--rule2);color:var(--ink2);border-color:var(--muted)}

/* Overview */
.fleet-line{display:flex;align-items:baseline;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.fleet-line .pct{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.fleet-line .lbl{color:var(--ink2);max-width:40ch}
.segbar{display:flex;height:28px;border:1px solid var(--ink);margin:6px 0 10px}
.segbar div{height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:#fff;overflow:hidden;white-space:nowrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
.cat-row{display:grid;grid-template-columns:140px 1fr 60px;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--rule2);font-size:13px}
.cat-row:last-child{border-bottom:0}
.minibar{height:8px;background:var(--rule2);position:relative}
.minibar i{position:absolute;left:0;top:0;bottom:0;background:var(--blue)}
.minibar i.low{background:var(--amber)}
.cat-row .v{font-family:var(--mono);font-size:12px;text-align:right;color:var(--ink2)}
.alert{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule2);font-size:13px;align-items:start}
.alert:last-child{border-bottom:0}
.alert .what{color:var(--ink)}
.alert .what small{display:block;color:var(--muted);font-size:12px}
.dep-row{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:11px 0;border-bottom:1px solid var(--rule2);cursor:pointer}
.dep-row:hover .dname{color:var(--blue);text-decoration:underline}
.dep-row:last-child{border-bottom:0}
.dname{font-weight:600}
.dmeta{font-size:12.5px;color:var(--ink2)}

/* Tables */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar input,.toolbar select{font-family:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--rule);background:#fff;color:var(--ink);border-radius:2px}
.toolbar input{width:240px}
.tablewrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;color:var(--ink2);font-size:12px;padding:9px 12px;border-bottom:1.5px solid var(--ink);background:var(--sheet);position:sticky;top:0;white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--rule2);vertical-align:middle;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#F3F5F9}
tbody tr.sel td{background:var(--blue-soft)}
td.warn{color:var(--amber);font-weight:600}
td.bad{color:var(--red);font-weight:600}
.cyc{display:inline-flex;align-items:center;gap:8px}
.cyc .minibar{width:60px;height:6px}

/* Buttons */
.btn{border:1px solid var(--ink);background:#fff;color:var(--ink);padding:7px 12px;border-radius:2px;font-weight:600}
.btn:hover{background:var(--ink);color:#fff}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#163C6D}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:var(--red);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed;background:#fff;color:var(--ink)}
.btn.sm{padding:4px 9px;font-size:12px}

/* Drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100%;background:var(--sheet);border-left:2px solid var(--ink);box-shadow:-12px 0 30px rgba(27,34,48,.12);transform:translateX(105%);transition:transform .22s ease;z-index:20;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer header{padding:20px 22px 14px;border-bottom:1px solid var(--rule)}
.drawer header .id{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.drawer header h3{margin:4px 0 8px;font-size:19px;letter-spacing:-.01em}
.drawer .body{padding:16px 22px;overflow:auto;flex:1}
.drawer .close{position:absolute;top:14px;right:14px;background:none;border:1px solid var(--rule);width:30px;height:30px;font-size:16px;border-radius:2px}
dl.kv{display:grid;grid-template-columns:130px 1fr;gap:7px 12px;margin:0 0 18px;font-size:13px}
dl.kv dt{color:var(--ink2)}
dl.kv dd{margin:0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.hist{border-left:2px solid var(--rule);padding-left:14px;margin:0;list-style:none}
.hist li{position:relative;padding:0 0 12px;font-size:13px}
.hist li::before{content:"";position:absolute;left:-19px;top:5px;width:8px;height:8px;background:var(--sheet);border:2px solid var(--blue);border-radius:50%}
.hist time{display:block;font-family:var(--mono);font-size:11.5px;color:var(--muted)}

/* Manifest */
.dep-head{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start;margin-bottom:18px}
.dep-head select{font-family:inherit;font-size:15px;font-weight:600;padding:8px 10px;border:1.5px solid var(--ink);background:#fff;border-radius:2px;max-width:100%}
.dep-facts{display:flex;gap:26px;margin-top:12px;flex-wrap:wrap;font-size:13px}
.dep-facts div span{display:block;color:var(--ink2);font-size:12px}
.dep-facts div b{font-weight:600}
.verdict{border:3px solid;padding:12px 18px;text-align:center;min-width:230px;transform:rotate(-1.2deg);background:var(--sheet)}
.verdict .big{font-size:24px;font-weight:800;letter-spacing:.04em;line-height:1.1}
.verdict small{display:block;font-size:12px;margin-top:4px;font-weight:500}
.verdict.ok{border-color:var(--green);color:var(--green)}
.verdict.caveat{border-color:var(--amber);color:var(--amber)}
.verdict.no{border-color:var(--red);color:var(--red)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:0;border:1px solid var(--rule);background:var(--sheet);margin-bottom:18px}
.check{padding:12px 14px;border-right:1px solid var(--rule2);border-bottom:1px solid var(--rule2);display:grid;grid-template-columns:22px 1fr;gap:8px}
.check .mark{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;margin-top:1px}
.check.pass .mark{background:var(--green)}
.check.warn .mark{background:var(--amber)}
.check.fail .mark{background:var(--red)}
.check.info .mark{background:var(--blue)}
.check b{display:block;font-size:13px}
.check p{margin:2px 0 0;font-size:12.5px;color:var(--ink2)}
.m-grid{display:grid;grid-template-columns:1fr 330px;gap:18px;align-items:start}
.pick{max-height:560px;overflow:auto}
.pick-item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--rule2);font-size:13px;align-items:center}
.pick-item .sub{font-size:12px;color:var(--muted)}
.linefail td:first-child{box-shadow:inset 3px 0 var(--red)}
.linewarn td:first-child{box-shadow:inset 3px 0 var(--amber)}
.issues{font-size:12px;color:var(--red);white-space:normal;min-width:180px}
.issues.w{color:var(--amber)}
.dg{border:1px solid var(--magenta);background:var(--magenta-soft);padding:12px 14px;margin-top:14px;font-size:13px}
.dg b{color:var(--magenta)}
.empty{padding:30px;text-align:center;color:var(--ink2)}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;font-size:13px;border-radius:2px;opacity:0;transition:all .2s;z-index:30;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  aside{flex-direction:row;align-items:center;flex-wrap:wrap;padding:12px 16px}
  nav{flex-direction:row;flex-wrap:wrap}
  .side-foot{display:none}
  main{padding:20px 16px}
  .g-2,.g-3,.m-grid,.dep-head{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  aside,.toolbar,.btn,.drawer,.pick-col,.verdict{display:none!important}
  body{background:#fff}
  main{padding:0}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">Kit & Readiness<small>Deployment logistics</small></div>
    <nav id="nav"></nav>
    <div class="side-foot">Stores: <b>Cambridge hangar</b><br>Demo build, fictional data<br>&copy; Emil Endres 2026 &middot; <a href="https://emilendres.com" target="_blank" rel="noopener" style="color:#DDE2EA;border-bottom:1px solid #4A5263;text-decoration:none">emilendres.com</a></div>
  </aside>
  <main id="main"></main>
</div>
<div class="drawer" id="drawer" aria-hidden="true"></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- Reference data ---------- */
const TODAY = new Date('2026-09-22');
const fmt = d => new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const iso = d => new Date(d).toISOString().slice(0,10);
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return iso(x); };
const days = (a,b) => Math.round((new Date(b)-new Date(a))/864e5);

const MODELS = {
  M4TD:  {cat:'Aircraft', name:'DJI Matrice 4TD', fw:'v11.02.0204', value:9800, bat:'B-M4'},
  M3D:   {cat:'Aircraft', name:'DJI Matrice 3D', fw:'v10.03.0508', value:7400, bat:'B-M3'},
  M3E:   {cat:'Aircraft', name:'DJI Mavic 3 Enterprise', fw:'v10.01.1612', value:3900, bat:'B-M3'},
  DOCK3: {cat:'Docks', name:'DJI Dock 3', fw:'v11.02.0204', value:18500},
  DOCK2: {cat:'Docks', name:'DJI Dock 2', fw:'v10.03.0508', value:12900},
  RCP2:  {cat:'Ground control', name:'DJI RC Plus 2 controller', fw:'v11.02.0204', value:1600},
  RCPRO: {cat:'Ground control', name:'DJI RC Pro Enterprise', fw:'v10.01.1612', value:1100},
  LAP:   {cat:'Ground control', name:'Rugged field laptop', value:2400},
  'B-M4':{cat:'Batteries', name:'Matrice 4 flight battery', wh:99, limit:200, value:260},
  'B-M3':{cat:'Batteries', name:'Mavic 3 / Matrice 3 flight battery', wh:77, limit:200, value:190},
  PWR:   {cat:'Power', name:'Portable power station 2 kWh', wh:2048, value:1500},
  HUB:   {cat:'Power', name:'Battery charging hub', value:180},
  RTK:   {cat:'GNSS / RTK', name:'D-RTK 3 base station', fw:'v01.00.0300', value:2800},
  CELL:  {cat:'Comms', name:'4G cellular dongle', value:120},
  SAT:   {cat:'Comms', name:'Satellite internet terminal', value:450},
  RAD:   {cat:'Comms', name:'Handheld radio pair', value:220},
  PROP:  {cat:'Spares', name:'Propeller set (4 pairs)', value:80},
  ARM:   {cat:'Spares', name:'Replacement arm assembly', value:340},
  TOOL:  {cat:'Tools & safety', name:'Field tool kit', value:260},
  FIRE:  {cat:'Tools & safety', name:'Fire containment bag (Li-ion)', value:95},
  FAK:   {cat:'Tools & safety', name:'First aid kit', value:60},
  CORD:  {cat:'Tools & safety', name:'Cordon kit (cones, signage)', value:150},
  CASE:  {cat:'Tools & safety', name:'Hard transit case', value:310},
};
const STATUS = {
  S:{label:'Serviceable', c:'s'}, D:{label:'Deployed', c:'d'}, R:{label:'In repair', c:'r'},
  U:{label:'Unserviceable', c:'u'}, I:{label:'Awaiting inspection', c:'i'}
};

/* ---------- Seed assets (deterministic) ---------- */
let seed = 7;
const rnd = () => (seed = (seed*9301+49297)%233280)/233280;
const serial = p => p + Array.from({length:8},()=> '0123456789ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(rnd()*33)]).join('');
const PREFIX = {Aircraft:'AC','Docks':'DK','Ground control':'GC','Batteries':'BT','Power':'PW','GNSS / RTK':'GN','Comms':'CM','Spares':'SP','Tools & safety':'TS'};
const counters = {};
const assets = [];
function add(model, opts={}){
  const m = MODELS[model]; const pre = PREFIX[m.cat];
  counters[pre] = (counters[pre]||0)+1;
  const a = {
    id: pre + '-' + String(counters[pre]).padStart(3,'0'), model, serial: serial(m.fw?'1ZN':'SN'),
    status: opts.status || 'S', location: opts.location || 'Cambridge hangar, Bay ' + (1+Math.floor(rnd()*4)),
    fw: m.fw ? (opts.fw || m.fw) : null,
    cycles: m.limit ? (opts.cycles ?? Math.floor(20 + rnd()*120)) : null,
    lastService: opts.last || addDays(TODAY, -Math.floor(5+rnd()*30)),
    deployment: opts.dep || null, note: opts.note || '', history: []
  };
  a.nextService = opts.next || addDays(a.lastService, m.cat==='Aircraft'||m.cat==='Docks' ? 90 : 180);
  a.history.push({t: addDays(TODAY,-240-Math.floor(rnd()*60)), e:'Received into stores and tagged'});
  a.history.push({t: a.lastService, e:'Scheduled maintenance completed'});
  if (opts.hist) opts.hist.forEach(h=>a.history.push(h));
  assets.push(a); return a;
}
// Aircraft
add('M4TD'); add('M4TD'); add('M4TD',{fw:'v11.01.0112', note:'Firmware behind baseline'});
add('M4TD',{status:'R', location:'Manufacturer repair centre', note:'Gimbal fault, returned under warranty', hist:[{t:addDays(TODAY,-9), e:'Gimbal calibration failure logged on post-flight inspection'},{t:addDays(TODAY,-6), e:'Sent for repair, RMA 44817'}]});
add('M3D'); add('M3D',{next:addDays(TODAY,6)});
add('M3E'); add('M3E',{status:'U', note:'Cracked arm after hard landing', hist:[{t:addDays(TODAY,-3), e:'Marked unserviceable: cracked rear-left arm'}]});
// Docks
add('DOCK3',{status:'D', location:'Site B, Norfolk (installed)', dep:'DEP-26-027'});
add('DOCK3'); add('DOCK2',{fw:'v10.02.0310', note:'Firmware behind baseline'});
// Ground control
add('RCP2'); add('RCP2'); add('RCP2'); add('RCPRO'); add('LAP'); add('LAP',{next:addDays(TODAY,-4)});
// Batteries
for (let i=0;i<10;i++) add('B-M4', i===2?{cycles:184}:i===5?{cycles:203, status:'U', note:'Exceeded cycle limit'}:i===7?{cycles:171}:{});
for (let i=0;i<8;i++) add('B-M3', i===3?{status:'I', location:'Inspection bench'}:{});
// Power, GNSS, comms
add('PWR'); add('PWR'); add('HUB'); add('HUB'); add('HUB');
add('RTK'); add('RTK',{next:addDays(TODAY,12)});
add('CELL'); add('CELL'); add('SAT'); add('RAD'); add('RAD');
// Spares, tools, safety
add('PROP'); add('PROP'); add('PROP'); add('ARM'); add('ARM');
add('TOOL'); add('TOOL'); add('FIRE'); add('FIRE'); add('FAK'); add('FAK'); add('CORD'); add('CASE'); add('CASE'); add('CASE');

const byId = id => assets.find(a=>a.id===id);

/* ---------- Deployments ---------- */
const deployments = [
  {id:'DEP-26-031', name:'Autonomous site commissioning', location:'Bolzano', country:'Italy', start:addDays(TODAY,9), end:addDays(TODAY,16), lead:'E. Endres', type:'Commissioning', state:'Planning',
   manifest:['AC-001','AC-002','BT-001','BT-002','BT-003','BT-004','BT-005','BT-010','DK-002','GC-001','GC-005','GN-001','PW-001','PW-003','CM-001','CM-003','SP-001','SP-004','TS-001','TS-003','TS-006','TS-007','TS-008']},
  {id:'DEP-26-033', name:'Operator training course', location:'Cambridgeshire', country:'United Kingdom', start:addDays(TODAY,4), end:addDays(TODAY,6), lead:'E. Endres', type:'Training', state:'Planning',
   manifest:['AC-005','AC-007','BT-011','BT-012','BT-013','BT-015','BT-016','BT-017','GC-004','GC-002','PW-004','CM-004','TS-002','TS-004','TS-005','TS-007','TS-009']},
  {id:'DEP-26-035', name:'Customer demonstration', location:'Rotterdam', country:'Netherlands', start:addDays(TODAY,20), end:addDays(TODAY,22), lead:'E. Endres', type:'Demonstration', state:'Planning',
   manifest:['AC-003','AC-008','BT-007','BT-008','BT-009','GC-003','CM-004','TS-004','TS-009']},
  {id:'DEP-26-027', name:'Persistent monitoring site', location:'Site B, Norfolk', country:'United Kingdom', start:addDays(TODAY,-30), end:addDays(TODAY,60), lead:'E. Endres', type:'Installation', state:'Issued',
   manifest:['DK-001']},
];
const depById = id => deployments.find(d=>d.id===id);

const log = [
  {t:addDays(TODAY,-1), e:'BT-004 returned to stores after charge-cycle test'},
  {t:addDays(TODAY,-3), e:'AC-008 marked unserviceable: cracked rear-left arm'},
  {t:addDays(TODAY,-6), e:'AC-004 sent for repair, RMA 44817'},
  {t:addDays(TODAY,-30), e:'DEP-26-027 issued: DK-001 installed at Site B, Norfolk'},
];

/* ---------- State ---------- */
const state = { view:'overview', filter:{q:'', cat:'all', status:'all'}, dep:'DEP-26-031', sel:null };

/* ---------- Readiness logic ---------- */
function overlaps(a,b){ return new Date(a.start) <= new Date(b.end) && new Date(b.start) <= new Date(a.end); }
function lineIssues(a, dep){
  const m = MODELS[a.model]; const fail=[], warn=[];
  const issuedHere = a.status==='D' && a.deployment===dep.id;
  if (!issuedHere && a.status!=='S') fail.push(STATUS[a.status].label);
  if (a.nextService && new Date(a.nextService) <= new Date(dep.end)) fail.push('Maintenance due ' + fmt(a.nextService));
  if (a.fw && a.fw !== m.fw) warn.push('Firmware ' + a.fw + ', baseline ' + m.fw);
  if (m.limit){ if (a.cycles >= m.limit) fail.push('Cycle limit reached'); else if (a.cycles >= m.limit*0.85) warn.push(a.cycles + ' of ' + m.limit + ' cycles'); }
  deployments.forEach(o=>{ if (o.id!==dep.id && o.state!=='Recovered' && o.manifest.includes(a.id) && overlaps(o,dep)) fail.push('Also allocated to ' + o.id); });
  return {fail, warn};
}
function assess(dep){
  const items = dep.manifest.map(byId).filter(Boolean);
  const lines = items.map(a=>({a, ...lineIssues(a,dep)}));
  const checks = [];
  const count = (f)=> lines.filter(f).length;
  const svc = lines.filter(l=>l.fail.some(x=>Object.values(STATUS).some(s=>s.label===x)));
  checks.push(svc.length ? {s:'fail', t:'Serviceability', p: svc.length + ' item(s) not serviceable: ' + svc.map(l=>l.a.id).join(', ')} : {s:'pass', t:'Serviceability', p:'All ' + items.length + ' items serviceable'});
  const mnt = lines.filter(l=>l.fail.some(x=>x.startsWith('Maintenance')));
  checks.push(mnt.length ? {s:'fail', t:'Maintenance window', p: mnt.map(l=>l.a.id).join(', ') + ' due before return on ' + fmt(dep.end)} : {s:'pass', t:'Maintenance window', p:'Nothing falls due before return'});
  const fw = lines.filter(l=>l.warn.some(x=>x.startsWith('Firmware')));
  checks.push(fw.length ? {s:'warn', t:'Configuration baseline', p: fw.map(l=>l.a.id).join(', ') + ' behind firmware baseline'} : {s:'pass', t:'Configuration baseline', p:'All items on approved firmware'});
  const cyc = lines.filter(l=>l.fail.includes('Cycle limit reached') || l.warn.some(x=>x.includes('cycles')));
  checks.push(cyc.length ? {s: lines.some(l=>l.fail.includes('Cycle limit reached'))?'fail':'warn', t:'Battery health', p: cyc.map(l=>l.a.id + ' (' + l.a.cycles + ')').join(', ') + ' near or over cycle limit'} : {s:'pass', t:'Battery health', p:'All batteries within cycle limits'});
  // batteries per aircraft
  const aircraft = items.filter(a=>MODELS[a.model].cat==='Aircraft');
  const short = [];
  ['B-M4','B-M3'].forEach(b=>{
    const need = aircraft.filter(a=>MODELS[a.model].bat===b).length*3;
    const have = items.filter(a=>a.model===b).length;
    if (need && have<need) short.push(MODELS[b].name + ': ' + have + ' of ' + need);
  });
  checks.push(short.length ? {s:'warn', t:'Battery scaling (3 per aircraft)', p: short.join('; ')} : {s: aircraft.length?'pass':'info', t:'Battery scaling (3 per aircraft)', p: aircraft.length ? 'Sufficient batteries for ' + aircraft.length + ' aircraft' : 'No aircraft on manifest'});
  const conf = lines.filter(l=>l.fail.some(x=>x.startsWith('Also allocated')));
  checks.push(conf.length ? {s:'fail', t:'Allocation conflicts', p: conf.map(l=>l.a.id).join(', ') + ' double-booked on overlapping dates'} : {s:'pass', t:'Allocation conflicts', p:'No clashes with other deployments'});
  const hasFire = items.some(a=>a.model==='FIRE'), hasFak = items.some(a=>a.model==='FAK');
  checks.push(hasFire && hasFak ? {s:'pass', t:'Safety equipment', p:'Fire containment bag and first aid kit included'} : {s:'fail', t:'Safety equipment', p:'Missing: ' + [!hasFire&&'fire containment bag', !hasFak&&'first aid kit'].filter(Boolean).join(', ')});
  const value = items.reduce((s,a)=>s+MODELS[a.model].value,0);
  if (dep.country !== 'United Kingdom') checks.push({s:'info', t:'Temporary export', p:'ATA carnet list: ' + items.length + ' items, declared value £' + value.toLocaleString('en-GB')});
  else checks.push({s:'pass', t:'Temporary export', p:'Domestic deployment, no customs paperwork'});
  const verdict = checks.some(c=>c.s==='fail') ? 'no' : checks.some(c=>c.s==='warn') ? 'caveat' : 'ok';
  // DG
  const li = items.filter(a=>MODELS[a.model].wh);
  const dg = { count: li.length, wh: li.reduce((s,a)=>s+MODELS[a.model].wh,0), over100: li.filter(a=>MODELS[a.model].wh>100).length };
  return {items, lines, checks, verdict, value, dg};
}

/* ---------- Actions ---------- */
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2400); }
function record(a, e){ a.history.push({t:iso(TODAY), e}); log.unshift({t:iso(TODAY), e: a.id + ' ' + e.charAt(0).toLowerCase() + e.slice(1)}); }
const ACT = {
  unserviceable(a){ const r = prompt('Reason for marking ' + a.id + ' unserviceable:', 'Damage found on inspection'); if(!r) return; a.status='U'; a.note=r; record(a,'Marked unserviceable: ' + r); toast(a.id + ' marked unserviceable'); },
  repair(a){ a.status='R'; a.location='Repair workshop'; record(a,'Sent for repair'); toast(a.id + ' sent for repair'); },
  serviceable(a){ a.status='S'; a.location='Cambridge hangar, Bay 1'; a.note=''; record(a,'Inspected and returned to stores as serviceable'); toast(a.id + ' returned to stores'); },
  maintain(a){ a.lastService=iso(TODAY); a.nextService=addDays(TODAY, ['Aircraft','Docks'].includes(MODELS[a.model].cat)?90:180); record(a,'Scheduled maintenance completed'); toast('Maintenance logged for ' + a.id); },
  firmware(a){ const m=MODELS[a.model]; const old=a.fw; a.fw=m.fw; a.note=''; record(a,'Firmware updated ' + old + ' to ' + m.fw); toast(a.id + ' updated to baseline firmware'); },
};
function issue(dep){
  const r = assess(dep);
  if (r.verdict==='no' && !confirm('This deployment has failed checks. Issue the kit anyway?')) return;
  r.items.forEach(a=>{ a.status='D'; a.deployment=dep.id; a.location=dep.location + ' (' + dep.id + ')'; a.history.push({t:iso(TODAY), e:'Issued to ' + dep.id}); });
  dep.state='Issued'; log.unshift({t:iso(TODAY), e: dep.id + ' issued: ' + r.items.length + ' items to ' + dep.location});
  toast(dep.id + ' issued: ' + r.items.length + ' items'); render();
}
function recover(dep){
  const items = dep.manifest.map(byId).filter(a=>a && a.deployment===dep.id);
  items.forEach(a=>{ a.status='I'; a.deployment=null; a.location='Inspection bench'; a.history.push({t:iso(TODAY), e:'Recovered from ' + dep.id + ', awaiting post-deployment inspection'}); });
  dep.state='Recovered'; log.unshift({t:iso(TODAY), e: dep.id + ' recovered: ' + items.length + ' items to inspection'});
  toast(items.length + ' items recovered to inspection'); render();
}
function exportCSV(dep){
  const r = assess(dep);
  const rows = [['Deployment','Asset ID','Description','Serial','Category','Firmware','Li-ion Wh','Value GBP','Status','Issues']];
  r.lines.forEach(l=>{ const m=MODELS[l.a.model]; rows.push([dep.id,l.a.id,m.name,l.a.serial,m.cat,l.a.fw||'',m.wh||'',m.value,STATUS[l.a.status].label,[...l.fail,...l.warn].join('; ')]); });
  const csv = rows.map(r=>r.map(v=>'"' + String(v).replace(/"/g,'""') + '"').join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download = dep.id + '-manifest.csv'; a.click();
  toast('Manifest exported');
}

/* ---------- Views ---------- */
const chip = s => '<span class="chip ' + STATUS[s].c + '">' + STATUS[s].label + '</span>';
const verdictLabel = {ok:['READY','All checks passed'], caveat:['READY WITH CAVEATS','Review warnings before issue'], no:['NOT READY','Resolve failed checks']};
const verdictChip = v => '<span class="chip ' + (v==='ok'?'s':v==='caveat'?'r':'u') + '">' + verdictLabel[v][0].charAt(0) + verdictLabel[v][0].slice(1).toLowerCase() + '</span>';

function attention(){
  const list = [];
  assets.forEach(a=>{
    const m = MODELS[a.model];
    if (a.status==='U') list.push({k:'u', a, t:'Unserviceable', s:a.note});
    if (a.status==='I') list.push({k:'i', a, t:'Awaiting inspection', s:a.location});
    if (a.nextService && days(TODAY,a.nextService) < 0) list.push({k:'u', a, t:'Maintenance overdue', s:'Due ' + fmt(a.nextService)});
    else if (a.nextService && days(TODAY,a.nextService) <= 14) list.push({k:'r', a, t:'Maintenance due soon', s:'Due ' + fmt(a.nextService)});
    if (a.fw && a.fw !== m.fw) list.push({k:'r', a, t:'Firmware behind baseline', s:a.fw + ' installed, baseline ' + m.fw});
    if (m.limit && a.cycles >= m.limit*0.85 && a.status!=='U') list.push({k:'r', a, t:'Battery near cycle limit', s:a.cycles + ' of ' + m.limit + ' cycles'});
  });
  return list;
}

function vOverview(){

  const col = {S:'var(--green)', D:'var(--blue)', R:'var(--amber)', U:'var(--red)', I:'var(--magenta)'};
  const seg = Object.keys(STATUS).filter(k=>counts[k]).map(k=>'<div style="width:'+(counts[k]/total*100)+'%;background:'+col[k]+'" title="'+STATUS[k].label+'">'+counts[k]+'</div>').join('');
  const legend = Object.keys(STATUS).map(k=>'<span style="--c:'+col[k]+'">'+STATUS[k].label+' '+counts[k]+'</span>').join('');
  const cats = [...new Set(Object.values(MODELS).map(m=>m.cat))].map(c=>{
    const inCat = assets.filter(a=>MODELS[a.model].cat===c); const ok = inCat.filter(a=>a.status==='S'||a.status==='D').length; const p = Math.round(ok/inCat.length*100);
    return '<div class="cat-row"><span>'+c+'</span><div class="minibar"><i class="'+(p<80?'low':'')+'" style="width:'+p+'%"></i></div><span class="v">'+ok+'/'+inCat.length+'</span></div>';
  }).join('');
  const att = attention();

    const r = assess(d); const until = days(TODAY,d.start);

  }).join('');
  return `
  <div class="top"><div><h1>Readiness overview</h1><p>Equipment state across stores and the field, and what needs attention before the next deployments.</p></div><div class="date">Stores date<br>${fmt(TODAY)}</div></div>
  <div class="grid g-2">
    <div class="grid" style="align-content:start">
      <section class="panel">
        <div class="fleet-line"><span class="pct">${avail}%</span><span class="lbl">operational availability: ${counts.S+counts.D} of ${total} tracked items serviceable or deployed</span></div>
        <div class="segbar">${seg}</div>
        <div class="legend">${legend}</div>
      </section>
      <section class="panel"><h2>Availability by category</h2>${cats}</section>
    </div>
    <div class="grid" style="align-content:start">
      <section class="panel"><h2>Upcoming and active deployments</h2>${deps}</section>
      <section class="panel"><h2>Needs attention (${att.length})</h2>
        ${att.slice(0,9).map(x=>'<div class="alert"><span class="chip '+x.k+'" style="min-width:66px;justify-content:center">'+x.a.id+'</span><div class="what">'+x.t+'<small>'+MODELS[x.a.model].name+' · '+x.s+'</small></div></div>').join('')}
        ${att.length>9?'<div class="dmeta" style="padding-top:8px">+ '+(att.length-9)+' more in Maintenance</div>':''}
      </section>
    </div>
  </div>`;
}

        ${a.status!=='D'?'<button class="btn" data-act="maintain">Log service</button>':''}
        ${a.fw&&a.fw!==m.fw?'<button class="btn" data-act="firmware">Update to baseline</button>':''}
      </div>
      <h2>History</h2>
      <ul class="hist">${a.history.slice().reverse().map(h=>'<li><time>'+fmt(h.t)+'</time>'+h.e+'</li>').join('')}</ul>
    </div>`;
  d.classList.add('open'); d.setAttribute('aria-hidden','false');
  d.querySelector('.close').onclick = closeDrawer;
  d.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{ ACT[b.dataset.act](a); render(); openDrawer(a.id); });
  document.querySelectorAll('tr[data-asset]').forEach(r=>r.classList.toggle('sel', r.dataset.asset===id));
}
function closeDrawer(){ const d=document.getElementById('drawer'); d.classList.remove('open'); d.setAttribute('aria-hidden','true'); state.sel=null; document.querySelectorAll('tr.sel').forEach(r=>r.classList.remove('sel')); }

/* ---------- Render ---------- */
const VIEWS = {overview:['Overview',vOverview], assets:['Asset register',vAssets], manifest:['Deployment manifest',vManifest], maint:['Maintenance',vMaint], log:['Activity log',vLog]};
function render(){
  const att = attention().length;
  document.getElementById('nav').innerHTML = Object.entries(VIEWS).map(([k,[l]])=>'<button class="'+(state.view===k?'active':'')+'" data-view="'+k+'">'+l+(k==='maint'&&att?'<span class="count">'+att+'</span>':'')+'</button>').join('');
  document.getElementById('main').innerHTML = VIEWS[state.view][1]();
  bind();
}
function go(view){ state.view=view; closeDrawer(); render(); window.scrollTo(0,0); }
function bind(){
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));
  document.querySelectorAll('[data-dep]').forEach(r=>{ const f=()=>{state.dep=r.dataset.dep; go('manifest');}; r.onclick=f; r.onkeydown=e=>{if(e.key==='Enter')f();}; });
  document.querySelectorAll('tr[data-asset]').forEach(r=>{ r.onclick=e=>{ if(e.target.closest('button')) return; openDrawer(r.dataset.asset); }; r.onkeydown=e=>{if(e.key==='Enter')openDrawer(r.dataset.asset);}; });
  const q=document.getElementById('q'); if(q){ q.oninput=()=>{state.filter.q=q.value; render(); const n=document.getElementById('q'); n.focus(); n.setSelectionRange(n.value.length,n.value.length);}; }
  const fc=document.getElementById('fcat'); if(fc) fc.onchange=()=>{state.filter.cat=fc.value; render();};
  const fs=document.getElementById('fstatus'); if(fs) fs.onchange=()=>{state.filter.status=fs.value; render();};
  const ds=document.getElementById('depsel'); if(ds) ds.onchange=()=>{state.dep=ds.value; render();};
  const dep = depById(state.dep);
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{ dep.manifest.push(b.dataset.add); toast(b.dataset.add + ' added to ' + dep.id); render(); });
  document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{ dep.manifest=dep.manifest.filter(x=>x!==b.dataset.remove); toast(b.dataset.remove + ' removed from ' + dep.id); render(); });
  document.querySelectorAll('[data-maint]').forEach(b=>b.onclick=()=>{ ACT.maintain(byId(b.dataset.maint)); render(); });
  const c=document.getElementById('csv'); if(c) c.onclick=()=>exportCSV(dep);
  const p=document.getElementById('print'); if(p) p.onclick=()=>window.print();
  const i=document.getElementById('issue'); if(i) i.onclick=()=>issue(dep);
  const rc=document.getElementById('recover'); if(rc) rc.onclick=()=>recover(dep);
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });
// legend colours
const st=document.createElement('style'); st.textContent='.legend span::before{background:var(--c)}'; document.head.appendChild(st);
render();
</script>
</body>
</html>
